[project]
name = "clipsvalorant"
version = "0.1.0"
description = "Find Twitch VOD moments of your own Valorant gameplay from streamers who were in your matches"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Layer 5: reading the broadcast itself. Optional because it also needs yt-dlp
# and ffmpeg on PATH, and because every other layer works without it.
vision = ["rapidocr-onnxruntime>=1.3", "pillow>=10.0", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipsvalorant"]

[tool.setuptools.package-data]
# db.py reads schema.sql from the package directory at runtime.
clipsvalorant = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
